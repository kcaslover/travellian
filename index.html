<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travellian</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/fonts.css" />
</head>

<body>
  <div class="background">
    <div class="container">
      <header class="header">
        <div class="header__logo">
          <a href="#">
            <img src="/images/Logo.svg" alt="" />
          </a>
        </div>
        <div class="header__nav-wrapper">
          <nav class="header__nav">
            <ul class="header__unordered-list">
              <li><a href="#" class="underline-effect">Home</a></li>
              <li><a href="#">Explore</a></li>
              <li><a href="#">Travel</a></li>
              <li><a href="#">Blog</a></li>
              <li><a href="#">Pricing</a></li>
            </ul>
          </nav>
        </div>
        <div class="header__btns">
          <button class="header__btn-login btn">Login</button>
          <button class="header__btn-signup btn">Sign up</button>
        </div>
      </header>
    </div>

    <!-- ---------- hero ------------ -->

    <section class="hero">
      <div class="container">
        <div class="hero__text">
          <h1 class="hero__heading">
            <span>Start your unforgettable </span>
            <span>journey with us.</span>
          </h1>
          <p>The best travel for your jouney begins now</p>
        </div>
      </div>
      <div class="hero__slider">
        <div class="slider__dots">
          <div class="dot main-dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="slider__arrows">
          <img src="/images/arrow-white.svg" alt="" />
          <img src="/images/arrow-orange.svg" alt="" />
        </div>
      </div>
      <form class="hero__form">
        <div class="form-group">
          <label for="destination">DESTINATION</label>
          <input type="text" id="destination" value="Dubai" />
        </div>

        <div class="form-group">
          <label for="person">PERSON</label>
          <select id="person">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4+</option>
          </select>
        </div>

        <div class="form-group">
          <label for="checkin">CHECK IN </label>
          <input type="date" id="checkin" value="2020-09-17" />
        </div>

        <div class="form-group">
          <label for="checkout">CHECK OUT</label>
          <input type="date" id="checkout" value="2020-10-17" />
        </div>

        <button class="book-btn btn">
          <div class="span-wrapper">
            <span>Book</span>
            <span>Now</span>
          </div>
          <div class="arrow-wrapper"><img src="/images/directional-arrow.svg" alt="" class="dir-arrow"></div>
        </button>
      </form>
    </section>
  </div>
  <main>
    <section class="destinations">
      <div class="container"></div>
    </section>
    <section class="special-offer">
      <div class="container"></div>
    </section>
    <section class="blog">
      <div class="container"></div>
    </section>
    <section class="trip-planners">
      <div class="container"></div>
    </section>
    <section class="gallery">
      <div class="container"></div>
    </section>
    <section class="testimonial">
      <div class="container"></div>
    </section>
  </main>
  <footer></footer>
</body>

</html>
